name: Publish Vloxx trivia

on:
  # Enable push-to-main deployment once private-repository Pages is available.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify quiz logic and content
        run: |
          node --test test/engine.test.js
          node --check dist/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload game files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public game
        id: deployment
        uses: actions/deploy-pages@v4
